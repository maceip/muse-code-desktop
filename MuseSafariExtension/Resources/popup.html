<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Muse on Safari</title>
  <style>
    * { box-sizing: border-box; }
    body {
      width: 232px;
      margin: 0;
      padding: 12px 14px;
      font-family: -apple-system, BlinkMacSystemFont, sans-serif;
      font-size: 13px;
      color: #111;
      background: transparent;
      user-select: none;
      -webkit-user-select: none;
    }
    @media (prefers-color-scheme: dark) {
      body { color: #f2f4f8; }
      button.secondary { background: rgba(255, 255, 255, 0.12); color: #f2f4f8; }
    }
    h3 {
      margin: 0 0 3px 0;
      font-size: 13.5px;
      font-weight: 600;
      letter-spacing: -0.01em;
    }
    p {
      margin: 0 0 11px 0;
      font-size: 12px;
      opacity: 0.72;
      line-height: 1.35;
    }
    .actions {
      display: flex;
      gap: 7px;
    }
    button {
      flex: 1;
      padding: 7px 10px;
      border-radius: 7px;
      border: none;
      font-weight: 600;
      font-size: 12px;
      cursor: pointer;
      background: #0077ff;
      color: #ffffff;
      transition: background 0.12s ease, opacity 0.12s ease;
      white-space: nowrap;
    }
    button.claimed-btn {
      background: #10b981;
      color: #ffffff;
      cursor: default;
    }
    button.secondary {
      flex: 0 0 auto;
      padding: 7px 12px;
      background: rgba(0, 0, 0, 0.08);
      color: #1d222b;
    }
    button:disabled {
      cursor: default;
    }
    button.secondary:disabled {
      opacity: 0.38;
      cursor: not-allowed;
    }
  </style>
</head>
<body>
  <h3>Muse on Safari</h3>
  <p id="subtitle">Let Muse code drive Safari</p>
  <div class="actions">
    <button id="claimBtn">Claim This Tab</button>
    <button id="releaseBtn" class="secondary" disabled>Release</button>
  </div>
  <script src="popup.js" type="module"></script>
</body>
</html>
