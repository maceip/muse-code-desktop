<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Muse Safari Bridge</title>
  <style>
    body {
      width: 300px;
      margin: 0;
      padding: 14px;
      font-family: -apple-system, BlinkMacSystemFont, sans-serif;
      font-size: 13px;
      color: #111;
      background: #f8f9fb;
    }
    @media (prefers-color-scheme: dark) {
      body { background: #16181d; color: #f2f4f8; }
      button.secondary { background: #262a33; color: #f2f4f8; }
    }
    h3 { margin: 0 0 6px 0; font-size: 14px; }
    p { margin: 0 0 10px 0; font-size: 12px; opacity: 0.78; line-height: 1.4; }
    .status {
      padding: 8px 10px;
      border-radius: 8px;
      background: rgba(0, 119, 255, 0.12);
      margin-bottom: 8px;
      font-size: 12px;
      word-break: break-word;
    }
    .perm-status {
      padding: 6px 10px;
      border-radius: 7px;
      background: rgba(34, 197, 94, 0.14);
      margin-bottom: 10px;
      font-size: 11.5px;
    }
    .perm-status.pending {
      background: rgba(245, 158, 11, 0.16);
    }
    .actions { display: flex; gap: 8px; margin-bottom: 8px; }
    button {
      flex: 1;
      padding: 7px 10px;
      border-radius: 7px;
      border: none;
      font-weight: 600;
      font-size: 12px;
      cursor: pointer;
      background: #0077ff;
      color: white;
    }
    button.full {
      width: 100%;
      display: block;
    }
    button.secondary {
      background: #e2e6ee;
      color: #1d222b;
    }
  </style>
</head>
<body>
  <h3>Muse Safari Bridge</h3>
  <p>Persistent DOM &amp; tab control bridge for Muse Code.</p>
  <div id="status" class="status">Checking owned tab…</div>
  <div id="permStatus" class="perm-status pending">Checking website access…</div>
  <div class="actions">
    <button id="claimBtn">Claim This Tab</button>
    <button id="releaseBtn" class="secondary">Release</button>
  </div>
  <button id="allowAllBtn" class="full">Allow on All Websites…</button>
  <script src="popup.js" type="module"></script>
</body>
</html>
