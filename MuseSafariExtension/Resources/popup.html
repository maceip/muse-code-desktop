<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Muse Safari Bridge</title>
  <style>
    body {
      width: 306px;
      margin: 0;
      padding: 14px;
      font-family: -apple-system, BlinkMacSystemFont, sans-serif;
      font-size: 13px;
      color: #111;
      background: #f8f9fb;
    }
    @media (prefers-color-scheme: dark) {
      body { background: #16181d; color: #f2f4f8; }
      button.secondary { background: #262a33; color: #f2f4f8; }
    }
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 6px;
    }
    h3 { margin: 0; font-size: 14px; }
    .pill-badge {
      font-size: 10.5px;
      font-weight: 700;
      padding: 2px 8px;
      border-radius: 999px;
      background: rgba(100, 116, 139, 0.18);
      color: #64748b;
    }
    .pill-badge.claimed {
      background: rgba(16, 185, 129, 0.20);
      color: #10b981;
    }
    p { margin: 0 0 10px 0; font-size: 12px; opacity: 0.78; line-height: 1.4; }
    .status {
      padding: 9px 11px;
      border-radius: 8px;
      background: rgba(100, 116, 139, 0.12);
      border: 1px solid rgba(100, 116, 139, 0.22);
      margin-bottom: 10px;
      font-size: 12px;
      word-break: break-word;
      transition: all 0.16s ease;
    }
    .status.claimed {
      background: rgba(16, 185, 129, 0.15);
      border-color: rgba(16, 185, 129, 0.48);
      color: #059669;
      font-weight: 600;
    }
    @media (prefers-color-scheme: dark) {
      .status.claimed {
        color: #34d399;
      }
    }
    .actions { display: flex; gap: 8px; margin-bottom: 8px; }
    button {
      flex: 1;
      padding: 8px 10px;
      border-radius: 7px;
      border: none;
      font-weight: 600;
      font-size: 12px;
      cursor: pointer;
      background: #0077ff;
      color: white;
      transition: all 0.14s ease;
    }
    button.claimed-btn {
      background: #10b981;
      color: #ffffff;
      cursor: default;
      box-shadow: 0 2px 8px rgba(16, 185, 129, 0.35);
    }
    button.release-active {
      background: #ef4444;
      color: #ffffff;
    }
    button:disabled {
      cursor: not-allowed;
    }
    button.secondary:disabled {
      opacity: 0.42;
    }
    button.full {
      width: 100%;
      display: block;
      margin-top: 4px;
    }
    button.secondary {
      background: #e2e6ee;
      color: #1d222b;
    }
  </style>
</head>
<body>
  <div class="header">
    <h3>Muse Safari Bridge</h3>
    <span id="statePill" class="pill-badge">IDLE</span>
  </div>
  <p>Persistent DOM &amp; tab control bridge for Muse Code.</p>
  <div id="status" class="status">Checking owned tab…</div>
  <div class="actions">
    <button id="claimBtn">Claim This Tab</button>
    <button id="releaseBtn" class="secondary" disabled>Release</button>
  </div>
  <button id="allowAllBtn" class="full" hidden>Always Allow on All Websites…</button>
  <script src="popup.js" type="module"></script>
</body>
</html>
