# Analytics lane for muse-code-desktop on Google Cloud Build.
# macOS app binaries are built by GitHub Actions (macos-15 runners) - Google
# Cloud Build has no macOS builders. This lane only: validates plists,
# computes repository analytics, and reports one event to the cheap-stack
# ingest endpoint (BigQuery). The ingest step is failure-tolerant
# (allowFailure) so losing the GCP project can never break this repo's builds.
options:
  machineType: E2_STANDARD_2
  logging: CLOUD_LOGGING_ONLY
steps:
  - name: python:3.12-slim
    id: repo-analytics
    entrypoint: python3
    args:
      - -c
      - |
        import json, pathlib, plistlib, sys
        root = pathlib.Path('/workspace')
        plists = list(root.rglob('*.plist'))
        bad = []
        for p in plists[:200]:
            try: plistlib.loads(p.read_bytes())
            except Exception as e: bad.append(f'{p.relative_to(root)}: {e}')
        swift = list(root.rglob('*.swift'))
        loc = 0
        for p in swift:
            try: loc += p.read_text(errors='replace').count(chr(10))
            except OSError: pass
        stats = {'swiftFiles': len(swift), 'swiftLoc': loc, 'plistFiles': len(plists), 'plistBad': len(bad)}
        pathlib.Path('/workspace/analytics.json').write_text(json.dumps(stats))
        print(stats)
        if bad:
            print('INVALID PLISTS:', bad[:5]); sys.exit(1)
  - name: python:3.12-slim
    id: report-analytics
    allowFailure: true
    entrypoint: python3
    secretEnv: ['INGEST_TOKEN']
    args:
      - -c
      - |
        import json, os, pathlib, urllib.request
        detail = pathlib.Path('/workspace/analytics.json').read_text()
        body = json.dumps({'kind': 'cloudbuild-analytics', 'detail': detail}).encode()
        req = urllib.request.Request(
            'https://cheap-stack-api-4mvkrnysdq-uc.a.run.app/api/events/muse-desktop',
            data=body, method='POST',
            headers={'Content-Type': 'application/json',
                     'Authorization': 'Bearer ' + os.environ['INGEST_TOKEN']})
        try:
            with urllib.request.urlopen(req, timeout=15) as r:
                print('ingest response:', r.read().decode())
        except Exception as e:
            print('WARN: cheap-stack ingest unavailable - continuing (fail-open):', e)
availableSecrets:
  secretManager:
    - versionName: projects/388281103542/secrets/cheap-stack-ingest-token/versions/latest
      env: INGEST_TOKEN
timeout: 600s
